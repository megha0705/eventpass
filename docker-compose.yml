services:
  postgres:
    image: postgres:16
    container_name: eventpass-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventpass
      POSTGRES_USER: eventpass_user
      POSTGRES_PASSWORD: eventpass_pass
    ports:
      - "5433:5432"
    volumes:
      - eventpass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventpass_user -d eventpass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  eventpass_pgdata: